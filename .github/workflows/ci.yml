name: CI

on:
  push:
    branches: [develop, stage, main]
  pull_request:
    branches: [develop, stage, main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run tests
        env:
          OPENPROJECT_TOKEN: test-token
          OPENPROJECT_APIROOT: http://localhost:8080
          MCP_SERVER_API: test-api-key
          LOGFIRE_TOKEN: test-logfire-token
        run: pytest -v